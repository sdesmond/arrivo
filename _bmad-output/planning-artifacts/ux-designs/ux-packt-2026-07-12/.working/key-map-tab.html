<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Key Screen — Map Tab, day selector + pins</title>
<style>
/*
  Governing spine sections:
  - EXPERIENCE.md: Information Architecture (Map Tab row), Component Patterns ("Map Tab day
    selector", "Map pin"), State Patterns (trip has Located Items, day scope selected),
    Interaction Primitives (segmented-control keyboard model), Key Flows (Flow 4 — Luis).
  - DESIGN.md: components (map-tab-day-selector, map-pin), Colors (accent-brand single-color
    pins, fg/fg-3 selected/unselected text).
  Shows the Map Tab's day selector reusing the trip-detail tab bar's exact visual language
  (2px accent-brand bottom border on the selected segment), with "Whole Trip" selected and
  every Located Item's pin rendered in a single accent-brand color — no per-day hue coding.
*/
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  background: #e9e9e6;
  display: flex;
  justify-content: center;
  padding: 32px;
}
.device-frame {
  width: 760px;
  background: #ffffff; /* --bg */
  border-radius: 14px;
  box-shadow: 0 24px 60px rgba(0,0,0,0.1), 0 2px 6px rgba(0,0,0,0.04); /* --shadow-3 */
  overflow: hidden;
}
.tab-bar {
  display: flex;
  align-items: center;
  gap: 0;
  padding: 0 24px;
  border-bottom: 1px solid rgba(20,20,18,0.08); /* --line */
  background: #ffffff;
}
.tab {
  padding: 12px 14px;
  font-size: 13px;
  color: #7a7a72; /* --fg-3 */
  border-bottom: 2px solid transparent;
}
.tab.active { color: #131311; font-weight: 600; border-bottom-color: #0e8b80; } /* --fg / --accent-brand */

.day-selector {
  display: flex;
  gap: 0;
  padding: 0 24px;
  overflow-x: auto;
  border-bottom: 1px solid rgba(20,20,18,0.08); /* --line */
}
.day-seg {
  min-height: 44px;
  min-width: 44px;
  display: flex;
  align-items: center;
  padding: 0 14px;
  font-size: 13px;
  color: #7a7a72; /* --fg-3 */
  border-bottom: 2px solid transparent;
  white-space: nowrap;
}
.day-seg.selected { color: #131311; font-weight: 600; border-bottom-color: #0e8b80; }

.map-area {
  position: relative;
  height: 340px;
  background: #f6f6f4; /* --surface, standing in for whichever base map tile style architecture picks */
}
.map-area svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.pin-label {
  position: absolute;
  font-size: 11px;
  color: #131311;
  background: #ffffff;
  padding: 1px 6px;
  border-radius: 4px;
  border: 1px solid rgba(20,20,18,0.08);
  transform: translate(-50%, -130%);
  white-space: nowrap;
}
.empty-note {
  padding: 12px 24px;
  font-size: 12px;
  color: #7a7a72;
  border-top: 1px solid rgba(20,20,18,0.08);
}
</style>
</head>
<body>

<div class="device-frame">
  <div class="tab-bar">
    <div class="tab">Reservations</div>
    <div class="tab">Itinerary</div>
    <div class="tab active">Map</div>
    <div class="tab">Docs</div>
    <div class="tab">Notes</div>
  </div>

  <div class="day-selector" role="tablist" aria-label="Map scope">
    <div class="day-seg selected" role="tab" aria-selected="true">Whole Trip</div>
    <div class="day-seg" role="tab" aria-selected="false">Day 1</div>
    <div class="day-seg" role="tab" aria-selected="false">Day 2</div>
    <div class="day-seg" role="tab" aria-selected="false">Day 3</div>
    <div class="day-seg" role="tab" aria-selected="false">Day 4</div>
    <div class="day-seg" role="tab" aria-selected="false">Day 5</div>
  </div>

  <div class="map-area">
    <svg viewBox="0 0 760 340">
      <line x1="0" y1="85" x2="760" y2="85" stroke="rgba(20,20,18,0.06)" stroke-width="1"/>
      <line x1="0" y1="170" x2="760" y2="170" stroke="rgba(20,20,18,0.06)" stroke-width="1"/>
      <line x1="0" y1="255" x2="760" y2="255" stroke="rgba(20,20,18,0.06)" stroke-width="1"/>
      <line x1="190" y1="0" x2="190" y2="340" stroke="rgba(20,20,18,0.06)" stroke-width="1"/>
      <line x1="380" y1="0" x2="380" y2="340" stroke="rgba(20,20,18,0.06)" stroke-width="1"/>
      <line x1="570" y1="0" x2="570" y2="340" stroke="rgba(20,20,18,0.06)" stroke-width="1"/>

      <!-- all pins: single accent-brand color, no per-day hue coding -->
      <circle cx="120" cy="90" r="7" fill="#0e8b80" stroke="#ffffff" stroke-width="2"/>
      <circle cx="260" cy="140" r="7" fill="#0e8b80" stroke="#ffffff" stroke-width="2"/>
      <circle cx="300" cy="150" r="7" fill="#0e8b80" stroke="#ffffff" stroke-width="2"/>
      <circle cx="430" cy="210" r="7" fill="#0e8b80" stroke="#ffffff" stroke-width="2"/>
      <circle cx="610" cy="260" r="7" fill="#0e8b80" stroke="#ffffff" stroke-width="2"/>
      <circle cx="650" cy="90" r="7" fill="#0e8b80" stroke="#ffffff" stroke-width="2"/>
    </svg>
    <div class="pin-label" style="left:120px; top:90px;">Senso-ji Temple</div>
    <div class="pin-label" style="left:280px; top:145px;">Nakamise-dori</div>
    <div class="pin-label" style="left:430px; top:210px;">Edo-Tokyo Museum</div>
    <div class="pin-label" style="left:610px; top:260px;">Ryokan Sakura</div>
    <div class="pin-label" style="left:650px; top:90px;">Tsukiji Outer Market</div>
  </div>
  <div class="empty-note">6 located stops across 5 days. Freeform items (e.g. "Shopping") aren't pinned — they stay visible in the Itinerary tab.</div>
</div>

</body>
</html>
