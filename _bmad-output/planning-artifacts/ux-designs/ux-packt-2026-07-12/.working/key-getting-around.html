<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Key Screen — Trip Edit, Getting Around section</title>
<style>
/*
  Governing spine sections:
  - EXPERIENCE.md: Component Patterns ("Getting Around section"), State Patterns (no explicit
    override / explicit override set), Interaction Primitives (segmented-control keyboard
    model — arrow-key roving tabindex, Home/End).
  - DESIGN.md: components (getting-around-segmented-control), Colors (accent-soft/accent-ink
    selected state, fg-3 unselected), Shapes (rounded.md).
  Shows the Getting Around section inside the Trip Edit sheet, with "Walk" selected as the
  seeded deterministic default (FR-7) — no distinct "this is a default" visual treatment,
  the value is real and valid, not a placeholder.
*/
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  background: #e9e9e6;
  display: flex;
  justify-content: center;
  padding: 40px;
}
.sheet {
  width: 380px;
  background: #ffffff; /* --bg */
  border-radius: 14px;
  box-shadow: 0 24px 60px rgba(0,0,0,0.1), 0 2px 6px rgba(0,0,0,0.04); /* --shadow-3 */
  padding: 20px;
}
.sheet-title { font-size: 16px; font-weight: 700; color: #131311; margin-bottom: 18px; }
.field-label { font-size: 12px; font-weight: 600; color: #4a4a45; margin-bottom: 8px; } /* --fg-2 */
.field-block { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid rgba(20,20,18,0.08); }

.segmented {
  display: flex;
  gap: 4px;
  background: #f6f6f4; /* --surface */
  border-radius: 8px; /* rounded.md */
  padding: 4px;
}
.segment {
  flex: 1;
  min-height: 44px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  border-radius: 6px;
  font-size: 11px;
  color: #7a7a72; /* --fg-3 */
  cursor: pointer;
}
.segment.selected {
  background: #d6efec; /* --accent-soft */
  color: #0a4a44; /* --accent-ink */
  font-weight: 600;
}
.helper { font-size: 12px; color: #7a7a72; margin-top: 8px; line-height: 1.4; }
</style>
</head>
<body>

<div class="sheet">
  <div class="sheet-title">Edit Trip</div>

  <div class="field-block">
    <div class="field-label">Getting Around</div>
    <div class="segmented" role="radiogroup" aria-label="Trip Transit Default">
      <div class="segment selected" role="radio" aria-checked="true" tabindex="0">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="13" cy="4" r="2"/><path d="M15 22l-1-6-3-2 1-6M9 22l3-8M6 12l3-3 3 1 3-1"/></svg>
        Walk
      </div>
      <div class="segment" role="radio" aria-checked="false" tabindex="-1">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 17h14M5 17a2 2 0 1 0 4 0M15 17a2 2 0 1 0 4 0M5 17l1.5-6h11L19 17M6.5 11l1-4h9l1 4"/></svg>
        Drive
      </div>
      <div class="segment" role="radio" aria-checked="false" tabindex="-1">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="3" width="16" height="14" rx="2"/><circle cx="8" cy="20" r="1"/><circle cx="16" cy="20" r="1"/></svg>
        Transit
      </div>
      <div class="segment" role="radio" aria-checked="false" tabindex="-1">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg>
        Smart
      </div>
    </div>
    <div class="helper">Used for Now Card distance estimates, Day Route Strip, and Schedule Conflict detection. Seeded to "Walk" — a deterministic default, not a placeholder.</div>
  </div>
</div>

</body>
</html>
