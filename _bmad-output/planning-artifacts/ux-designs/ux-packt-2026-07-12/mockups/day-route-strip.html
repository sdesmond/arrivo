<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Key Screen — Itinerary Day View, Day Route Strip + Schedule Conflict</title>
<style>
/*
  Governing spine sections:
  - EXPERIENCE.md: Component Patterns ("Day Route Strip", "Schedule Conflict row icon",
    "Schedule Conflict day badge"), State Patterns (day has >=2 Located Items + >=1 conflict),
    Key Flows (Flow 3 — Priya).
  - DESIGN.md: components (day-route-strip, schedule-conflict-row-icon,
    schedule-conflict-day-badge), Colors (warning/warning-soft/warning-ink, accent-brand),
    Shapes (rounded.lg on the strip card).
  Shows the day-with-conflict state: Day Route Strip at top of the day, day-level conflict
  badge ("1 tight connection today"), and the row-level triangle-alert icon on the specific
  affected PlaceRow (museum, following a too-tight restaurant slot) — mirrors Priya's flow.
  Time/Location chips are shown at the resized 44px minimum (DESIGN.md's place-row-action-chip
  token, a scope decision beyond the PRD's FRs so these chips don't sit undersized next to the
  new Address ButtonGroup) — the Location chip's full two-segment ButtonGroup structure is
  simplified here for legibility; see mockups/address-pill.html for that detail.
  [UPDATED 2026-07-13: the thumbnail's "tap to open Map Tab" affordance shown here depicts the
  post-Map-Tab-launch state (epics.md Epic 5). Before Map Tab ships (Epic 4), the same thumbnail
  renders without the "tap to open" title/meta text — present but non-interactive.]
*/
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  background: #e9e9e6;
  display: flex;
  justify-content: center;
  padding: 32px;
}
.device-frame {
  width: 620px;
  background: #ffffff; /* --bg */
  border-radius: 14px;
  box-shadow: 0 24px 60px rgba(0,0,0,0.1), 0 2px 6px rgba(0,0,0,0.04); /* --shadow-3 */
  overflow: hidden;
}
.day-header {
  padding: 16px 20px 4px;
  font-size: 15px; /* --fs-card-title */
  font-weight: 600;
  color: #131311; /* --fg */
}
.day-sub {
  padding: 0 20px 14px;
  font-size: 13px; /* --fs-card-sub */
  color: #7a7a72; /* --fg-3 */
}

/* Day Route Strip */
.route-strip {
  margin: 0 20px 16px;
  border: 1px solid rgba(20,20,18,0.08); /* --line */
  border-radius: 10px; /* rounded.lg */
  background: #f6f6f4; /* --surface */
  padding: 12px;
  display: flex;
  gap: 12px;
  align-items: center;
}
.thumb {
  width: 44px;
  height: 44px;
  border-radius: 8px;
  background: #efefec; /* --surface-2 */
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
  cursor: pointer;
}
.thumb svg { position: absolute; inset: 0; }
.strip-text { flex: 1; min-width: 0; }
.strip-title { font-size: 13px; font-weight: 600; color: #131311; margin-bottom: 2px; }
.strip-meta { font-size: 12px; color: #7a7a72; }
.conflict-day-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: 9999px; /* rounded.full */
  font-size: 12px;
  font-weight: 600;
  background: #fbeacb; /* --warning-soft */
  color: #6b4406; /* --warning-ink */
  margin-left: 8px;
  white-space: nowrap;
}

/* PlaceRow list */
.place-list { padding: 0 12px 20px; }
.place-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  border-radius: 8px;
  padding: 10px 12px;
  margin-bottom: 2px;
}
.place-row.now { background: #d6efec; border: 1px solid #0e8b80; } /* --accent-soft / --accent-brand */
.place-icon-col { display: flex; flex-direction: column; align-items: center; width: 16px; padding-top: 2px; }
.rail { width: 1px; flex: 1; min-height: 12px; background: rgba(20,20,18,0.08); margin-top: 2px; }
.place-content { flex: 1; min-width: 0; }
.place-name { font-size: 14px; font-weight: 600; color: #131311; }
.chip-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: 44px;
  border-radius: 9999px;
  padding: 0 14px;
  font-size: 12px;
}
.chip.time { background: #d6efec; color: #0a4a44; } /* filled time chip */
.chip.location { background: #d6efec; color: #0a4a44; }
.conflict-icon { color: #b6790a; display: inline-flex; align-items: center; } /* --warning */
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
</style>
</head>
<body>

<div class="device-frame">
  <div class="day-header">Day 3 — Thu, Oct 15</div>
  <div class="day-sub">4 stops</div>

  <div class="route-strip">
    <div class="thumb" title="Open Map Tab for Day 3">
      <svg viewBox="0 0 44 44" width="44" height="44">
        <path d="M6 34 L16 24 L24 30 L38 12" fill="none" stroke="#0e8b80" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.7"/>
        <circle cx="6" cy="34" r="3" fill="#e6e6e2" stroke="#c9c9c2" stroke-width="1"/>
        <circle cx="16" cy="24" r="3" fill="#e6e6e2" stroke="#c9c9c2" stroke-width="1"/>
        <circle cx="24" cy="30" r="3.5" fill="#0e8b80" stroke="#0e8b80" stroke-width="1"/>
        <circle cx="38" cy="12" r="3" fill="#e6e6e2" stroke="#c9c9c2" stroke-width="1"/>
      </svg>
    </div>
    <div class="strip-text">
      <div class="strip-title">2.1 km · 34 min walk<span class="conflict-day-badge"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>1 tight connection today</span></div>
      <div class="strip-meta">Walking · tap to open Map Tab</div>
    </div>
  </div>

  <div class="place-list">
    <div class="place-row">
      <div class="place-icon-col">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7a7a72" stroke-width="1.5"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <div class="rail"></div>
      </div>
      <div class="place-content">
        <div class="place-name">Nakamise Lunch</div>
        <div class="chip-row">
          <span class="chip time">12:00 PM – 1:00 PM</span>
          <span class="chip location">Nakamise-dori</span>
        </div>
      </div>
    </div>

    <div class="place-row">
      <div class="place-icon-col">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7a7a72" stroke-width="1.5"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <div class="rail"></div>
      </div>
      <div class="place-content">
        <div class="place-name">Edo-Tokyo Museum</div>
        <div class="chip-row">
          <span class="chip time">
            1:10 PM – 2:00 PM
            <span class="conflict-icon" aria-hidden="true" title="Schedule conflict">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>
            </span>
            <span class="sr-only">, Schedule conflict</span>
          </span>
          <span class="chip location">Edo-Tokyo Museum</span>
        </div>
      </div>
    </div>

    <div class="place-row">
      <div class="place-icon-col">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7a7a72" stroke-width="1.5"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
      </div>
      <div class="place-content">
        <div class="place-name">Shopping</div>
        <div class="chip-row">
          <span class="chip time" style="background:none;color:#a0a098;">Add time</span>
          <span class="chip location" style="background:none;color:#a0a098;">Add location</span>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
