# Approved epic breakdown; table order is build order.

[[entry]]
id = 1
type = "story"
title = "Sign-in to Activity tracer"
description = "Delivers generated Activity storage migration, safe historical identity and event contracts, bounded caught post-response recording, admin-only read service and /admin/activity table/navigation, and one completed sign-in event through the credentials gate including MFA, with a producer inventory and shared names for subsequent stories."
verify = "Unit/component and scenario-owned E2E tests show completed sign-in appears after refresh, MFA challenge alone produces no login, non-admin reads are denied, deleted identities retain history, and scheduling or persistence failure cannot change sign-in success."
covers = ["CAP-8"]
after = ["1.2"]
hitl = false
risk = "high"
notes = ["Branching: branch off feat/self-hosted-administration as ticket/<slug> and open the PR into feat/self-hosted-administration, never main (epic-activity-and-retention decision, 2026-10-24)."]

