type = "story"
title = "Retention policy and cleanup"
description = "Adds generated instance-policy migration with default 90 and allowed 30/90/180/365 days, explicit save and shortening confirmation, post-commit retention-change event, truthful saved versus cleanup status, and bounded dynamic-app-activity/save-triggered physical cleanup under an independent nonwaiting maintenance lock using saved policy and latest-event cutoff."
