# Approved epic breakdown; table order is build order.

[[entry]]
id = 1
type = "story"
title = "Credential-authorization schema and module"
description = "Adds the generated migration and a hash-only purpose-bound authorization table, plus issue, validate and consume services under AD-2 locks with an injectable clock; same-purpose issuance atomically invalidates the previous link and account deletion invalidates all of them."
verify = "Real-Postgres tests prove 256-bit hashed storage, 24-hour setup expiry, atomic replacement, single consumption under concurrent completion, expiry, and invalidation on account deletion."
covers = ["CAP-2", "CAP-3"]
after = []
hitl = false
risk = "high"
notes = ["Branching: branch off feat/self-hosted-administration as ticket/<slug> and open the PR into feat/self-hosted-administration, never main (epic-account-onboarding decision, 2026-10-24).", "Review: pin review: authority-locking (epic-account-onboarding decision, 2026-10-27; activity retro A1)."]

[[entry]]
id = 2
type = "story"
title = "Setup-only context tracer"
description = "Adds the separate account password-setup route outside the app layout with proxy allowlist entry, link-to-limited-cookie exchange that never consumes the link, token scrubbed from the URL, no-store and no-referrer headers, per-account throttles, and a stub dialog that revalidates against the database on every request."
verify = "On an initialized instance a valid link shows the stub dialog while the limited cookie is refused by the app layout, a server action and a storage read, and /setup and /sign-up still redirect to sign-in."
covers = ["CAP-2"]
after = [1, "1.8"]
hitl = false
risk = "high"
notes = ["Branching: branch off feat/self-hosted-administration as ticket/<slug> and open the PR into feat/self-hosted-administration, never main (epic-account-onboarding decision, 2026-10-24).", "Review: pin review: authority-locking (epic-account-onboarding decision, 2026-10-27; activity retro A1).", "`/setup` is reserved for first-run admin creation; the account password-setup route is separate and must work on an initialized instance (decision 2026-10-27)."]

