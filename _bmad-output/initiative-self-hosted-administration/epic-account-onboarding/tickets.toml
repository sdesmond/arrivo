hitl = false
risk = "high"
notes = ["Branching: branch off feat/self-hosted-administration as ticket/<slug> and open the PR into feat/self-hosted-administration, never main (epic-account-onboarding decision, 2026-10-24).", "Review: pin review: authority-locking (epic-account-onboarding decision, 2026-10-27; activity retro A1)."]

