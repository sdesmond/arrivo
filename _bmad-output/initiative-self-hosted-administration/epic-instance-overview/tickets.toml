[[entry]]
id = 1
type = "story"
title = "Overview tracer"
description = "Adds the Overview route and nav entry, makes /admin and Manage app land on it, and defines the per-metric reader contract (value or Unavailable, checkedAt) with version, DB health and user/admin/pending counts. Readers are plain functions returning that shape, rendered in a shared metric-card component that later entries reuse; keeps the Manage app heading and registers the new files under a new @feat: tag in tests/e2e/feature-map.mjs."
verify = "An admin opens Manage app and sees version, DB health and user/admin/pending counts, each with a checked time; a non-admin gets not-found; the build confirms the package.json version reaches the running app."
covers = ["CAP-10"]
after = ["1.2"]
hitl = false
risk = "medium"
notes = ["Branching: integration branch is feat/self-hosted-administration and accepts no direct pushes. Branch this ticket off it as ticket/<slug> and open a PR into it, never into main."]

