# Approved epic breakdown; table order is build order.

[[entry]]
id = 1
type = "story"
title = "Password reset tracer"
description = "Let an admin issue a one-hour reset link for another completed account and let its recipient securely replace the password while preserving MFA; use a purpose-bound limited context, trusted origin, token scrubbing, no-store and no-referrer responses, transport-aware cookies, CSRF protection, throttling and the shared password policy, and atomically revoke sessions and trusted devices, invalidate reset and recovery authorizations, and invalidate unfinished authentication proofs while serializing competing credential changes; record secret-free best-effort Activity."
verify = "Tests and E2E show issuance changes no credentials, a recipient resets and signs in afresh, MFA remains enabled, expired or replaced links and pre-reset MFA proofs fail, concurrent completions have one winner, and Activity failure does not block the action."
covers = ["CAP-6"]
after = ["3.1", "3.4", "3.5"]
hitl = false
risk = "high"
notes = ["Branching: branch off feat/self-hosted-administration as ticket/<slug> and open the PR into feat/self-hosted-administration, never main (decision 2026-10-24)."]

[[entry]]
id = 2
type = "story"
title = "Deletion concurrency and self-service"
description = "Coordinate instance, stable user and stable trip locks across account deletion, trip creation, and membership and ownership writers, while sharing last-admin protection and preserving self-service's explicit transfer or delete choices and post-commit effects."
verify = "Real-Postgres concurrency tests cover deletion against trip creation, membership and ownership changes, simultaneous admin removal, and unchanged self-service transfer and delete outcomes."
covers = ["CAP-5"]
after = [1, "1.5", "3.7"]
hitl = false
risk = "high"
notes = ["Branching: branch off feat/self-hosted-administration as ticket/<slug> and open the PR into feat/self-hosted-administration, never main (decision 2026-10-24)."]

[[entry]]
id = 3
type = "story"
title = "Admin deletion and private succession"
description = "Replace pending-only admin deletion with one flow for pending and completed accounts, previewing outcomes without private trip details and rechecking an opaque fingerprint under locks; transfer each trip to the earliest eligible manager or editor with user-ID tie-break, otherwise delete it, invalidate authorizations and invitations, and perform file cleanup, notifications and secret-free Activity after commit."
verify = "Tests and E2E show deterministic succession, viewers-only deletion, pending-account deletion, last-admin refusal, renewed review after changed outcomes, no private trip details, and cleanup or Activity failures leaving committed deletion intact."
covers = ["CAP-5"]
after = [2]
hitl = false
risk = "high"
notes = ["Branching: branch off feat/self-hosted-administration as ticket/<slug> and open the PR into feat/self-hosted-administration, never main (decision 2026-10-24)."]

