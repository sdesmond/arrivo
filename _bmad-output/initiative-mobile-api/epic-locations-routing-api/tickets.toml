[[entry]]
id = 1
type = "story"
title = "Search and retrieve locations through the API"
description = "Tracer: extract the three Mapbox search actions into src/lib/services/locations.ts in the cover-search.ts style (empty-input refusal, E2E_MAPBOX_STUB, missing token, mapboxSearch rate limit, 10s timeout, provider failure mapped to an API error envelope), add a locations contract and GET /api/v1/locations/search (mode destination|address, sessionToken) and GET /api/v1/locations/retrieve, document both, add them to the existing mapboxSearch rate-limit row in docs/api-v1.md, register api/v1/locations/** and services/locations.ts in feature-map.mjs, and switch use-location-autocomplete so new-trip, trip-edit-destination and location-lookup-input callers use the endpoints."
verify = "In create-trip.feature (destination scenario) and day-planning.feature, pick the stubbed Paris suggestion on the production build and see it saved after reload; service and route tests cover empty input, missing token, provider failure, rate limit and an unauthenticated request."
covers = ["R4", "R7"]
after = ["1.10", "7.9"]
hitl = false
risk = "medium"
notes = ["Base branch: feature/api-v1. Build each story on its own branch created from the latest feature/api-v1; open its PR with feature/api-v1 as the base/target. Do not build or commit stories directly on feature/api-v1, and do not target main. After opening the PR, switch back to feature/api-v1; before creating the next story branch, pull the latest feature/api-v1."]
references = ["_bmad-output/initiative-mobile-api/AGENTS.md"]

