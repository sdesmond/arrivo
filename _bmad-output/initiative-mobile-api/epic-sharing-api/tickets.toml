[[entry]]
id = 1
type = "story"
title = "Invite one contributor through the API"
description = "Tracer: migrate sharing-data and invitable-user GETs plus invitation POST through services, contracts and the sharing controller/form; establish deadline-aware atomic replay with existing user-before-trip locks, transactional manager checks, client UUID plumbing, pending/reinvite identity and transition/replay rules that later stories reuse."
verify = "A manager opens sharing, invites a registered user and sees the pending invitation after reload and on the invitee's live dashboard; colocated service, writer, contract, route and UI tests plus trip-sharing and API feature/step updates prove picker exclusions, expiry/reinvite, UUID collisions, no revival after rescind/dismiss, deadline rollback, manager-demotion races, replay and access concealment."
covers = ["S1","S2","S7","S8"]
after = ["1.10","3.10"]
hitl = false
risk = "high"
notes = ["Base branch: feature/api-v1. Build each story on its own branch created from the latest feature/api-v1; open its PR with feature/api-v1 as the base/target. Do not build or commit stories directly on feature/api-v1, and do not target main. After opening the PR, switch back to feature/api-v1; before creating the next story branch, pull the latest feature/api-v1."]
