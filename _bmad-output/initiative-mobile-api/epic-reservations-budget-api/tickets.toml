[[entry]]
id = 1
type = "story"
title = "Create reservations through the API"
description = "Tracer: expose POST and GET /api/v1/trips/:tripId/reservations with a client-supplied UUID, the createReservationSchema rules and REQUIRES_END_AT, trip lock with date-range widening and recordTripUpdated parity; add the reservation deletion-record kind and refuse creates of deleted ids; move reservation-date-range.ts and REQUIRES_END_AT into src/lib; switch the reservation-edit-drawer create caller and keep server-rendered reads direct."
verify = "In reservations.feature, add a reservation in the drawer and reload on the production build; route and service tests prove a replay yields one row, trip dates widen once, a deleted id cannot be recreated, and a viewer is denied."
covers = ["R4", "R7"]
after = ["1.10", "6.7"]
hitl = false
notes = ["Base branch: feature/api-v1. Build each story on its own branch created from the latest feature/api-v1; open its PR with feature/api-v1 as the base/target. Do not build or commit stories directly on feature/api-v1, and do not target main. After opening the PR, switch back to feature/api-v1; before creating the next story branch, pull the latest feature/api-v1."]
references = ["_bmad-output/initiative-mobile-api/AGENTS.md"]

