[[entry]]
id = 1
type = "story"
title = "Create and list owned packing templates"
description = "Expose owner-scoped collection reads and create through /api/v1, switch the web create caller to a draft-stable UUID, and retain direct server-rendered reads."
verify = "In templates.feature and route tests, create and reload, replay the create for one row, and verify a second user cannot list it."
covers = ["R4", "R7"]
after = ["1.10","5.12"]
hitl = false
notes = ["Base branch: feature/api-v1. Build each story on its own branch created from the latest feature/api-v1; open its PR with feature/api-v1 as the base/target. Do not build or commit stories directly on feature/api-v1, and do not target main. After opening the PR, switch back to feature/api-v1; before creating the next story branch, pull the latest feature/api-v1."]
references = ["_bmad-output/initiative-mobile-api/AGENTS.md"]

[[entry]]
id = 2
type = "story"
title = "Save the selected packing list as a template"
description = "Pass the selected list ID from the dialog, require editor access to its trip, and copy only its ordered items into an editor-owned template with remapped section IDs in one replay-safe transaction."
verify = "In save-trip-as-template.feature and service/route tests, seed two lists, verify only the selected contents and section links are copied once, reject an empty or wrong-trip selection, and deny replay after access is revoked."
covers = ["R4", "R7"]
after = [1,"5.5"]
hitl = false
notes = ["Base branch: feature/api-v1. Build each story on its own branch created from the latest feature/api-v1; open its PR with feature/api-v1 as the base/target. Do not build or commit stories directly on feature/api-v1, and do not target main. After opening the PR, switch back to feature/api-v1; before creating the next story branch, pull the latest feature/api-v1."]
