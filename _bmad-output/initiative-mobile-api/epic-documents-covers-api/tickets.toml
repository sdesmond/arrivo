# Epic 3: documents and covers through the API (source phase 2). Single lane for entries 1-7 and 9-10: each edits
# tests/e2e/feature-map.mjs, api.feature/api.steps.ts and the trip-detail action files, so each waits on the one before it.
# Entry 8 edits only src/lib/file-cleanup.ts, but shares the E2E database, port and build cache, so it runs in sequence before entry 3.
# Entries are planned; build plans own execution status. No estimates or calendar dates assigned.

[[entry]]
id = 1
type = "story"
title = "Upload one trip document through the API"
description = "Tracer: teach defineEndpoint, apiRoute and api() multipart bodies (one file part, named fields, per-request timeout), make upload-policy throw typed errors mapped to 413 payload_too_large and 422 for both the document and cover policies, raise the proxy body buffer for 25 MB, and ship a document service and POST /api/v1/trips/:tripId/documents (client document id kept across a user retry of the same file, stored file removed when the insert fails, afterTripWrite), switching trip-docs-tab, retiring uploadDocument and its wrapper, and recording the multipart contract and form-id replay in adr-api-contracts.md and the client-UUID ADR; entries 2-4 build on this document service and entries 2 and 6 on its multipart handling."
verify = "Route tests prove 413 over 25 MB, 422 for a disallowed or mismatched type, no row on storage failure and file removed on insert failure (both through getStorageAdapter), same-id replay, and a same-id upload from a user without access never returning the row; against the production server a 20 MB PDF uploads and shows after reload, documents.feature upload and bad-type scenarios use API waits, and api.feature proves viewer 403, stranger 404 and 403 for multipart without X-Arrivo-Client."
covers = ["D1","D2","D3","D8","D10"]
after = ["1.10","2.10"]
hitl = false
risk = "high"
notes = ["Base branch: feature/api-v1. Build each story on its own branch created from the latest feature/api-v1; open its PR with feature/api-v1 as the base/target. Do not build or commit stories directly on feature/api-v1, and do not target main. After opening the PR, switch back to feature/api-v1; before creating the next story branch, pull the latest feature/api-v1."]
references = ["_bmad-output/initiative-mobile-api/AGENTS.md"]

