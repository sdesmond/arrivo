# Epic 2: notes and itinerary through the API (source phase 2, first slices). Single lane: every entry edits
# actions.ts, tests/e2e/feature-map.mjs and api.feature, so each waits on the one before it.
# Entries are planned; build plans own execution status. No estimates or calendar dates assigned.

[[entry]]
id = 1
type = "story"
title = "Edit one event through the API"
description = "Tracer: add a transport-neutral ConflictError (migrating the pilot's collision() and idempotency 409s), map trips/[tripId]/actions.ts so its edits run every feature it serves, and ship the event service with partial PATCH /api/v1/events/:eventId (absent unchanged, null clears, note included, unscheduled day-less events included, linked-* events refused, Idempotency-Key opted in) through useApiMutation from use-trip-detail-handlers, retiring updateEvent; entries 4, 7 and 8 reuse the ConflictError."
verify = "Service, contract, route, errors and handler tests pass with 409 still asserted at the route; an editor edits an event's name, time and location in day-planning and sees them after reload, a day-less event PATCH persists in route tests, and viewer 403 and stranger 404 hold in api.feature, run against the production server per the pilot 1.10 plan procedure."
covers = ["I2","I7","I10"]
after = ["1.10","1.11"]
hitl = false
risk = "high"
notes = ["Base branch: feature/api-v1. Build each story on its own branch created from the latest feature/api-v1; open its PR with feature/api-v1 as the base/target. Do not build or commit stories directly on feature/api-v1, and do not target main. After opening the PR, switch back to feature/api-v1; before creating the next story branch, pull the latest feature/api-v1."]
references = ["_bmad-output/initiative-mobile-api/AGENTS.md","_bmad-output/initiative-mobile-api/epic-checklist-api-pilot/epic-checklist-api-pilot-retrospective.md#action-items","_bmad-output/initiative-mobile-api/epic-checklist-api-pilot/story-verify-checklist-pilot-end-to-end-plan.md"]

[[entry]]
id = 2
type = "story"
title = "Harden the API mutation client"
description = "Add a request timeout to the API client so a hung write releases its keyed queue, keep field errors per resource key, stop reporting a throwing onSuccess as a failed save, and skip effects on a no-op checklist-item PATCH, so later itinerary queues build on it."
verify = "client.test.ts and use-api-mutation.test.tsx prove a timed-out write fails and the next same-key write runs, concurrent independent writes keep each other's field errors, and onSuccess errors after commit are not shown as save failures; checklists.test.ts proves a same-value item PATCH publishes no activity or live-sync event."
covers = ["I9","I10"]
after = [1]
hitl = false
risk = "medium"
notes = ["Base branch: feature/api-v1. Build each story on its own branch created from the latest feature/api-v1; open its PR with feature/api-v1 as the base/target. Do not build or commit stories directly on feature/api-v1, and do not target main. After opening the PR, switch back to feature/api-v1; before creating the next story branch, pull the latest feature/api-v1."]
