<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trip Cover Overflow Menu — Key Screen Mock</title>
<style>
/*
  Illustrates: decision-log entries for
    - Cover Overflow Menu (FR-12): direct reuse of the now-card.tsx overflow pattern — MoreHorizontal
      trigger (absolute top-2 right-2, bg-black/25 text-white backdrop-blur-sm), DropdownMenuContent
      shown OPEN with "Edit Cover" (Pencil), "Remove Cover" (Trash2, destructive-icon convention from
      day-card-header.tsx's "Remove day" button), "Info" (Info) — all three visible because the cover
      is an Unsplash photo (Photo cover type).
    - cover-scrim gradient (--cover-scrim) over the photo, matching trip-cover.tsx.
*/

:root {
  --bg: #ffffff;
  --surface: #f6f6f4;
  --surface-2: #efefec;
  --surface-3: #e6e6e2;
  --line: rgba(20, 20, 18, 0.08);
  --line-strong: rgba(20, 20, 18, 0.14);
  --fg: #131311;
  --fg-2: #4a4a45;
  --fg-3: #7a7a72;
  --fg-4: #a0a098;

  --accent-brand: #0e8b80;
  --accent-soft: #d6efec;
  --accent-fg: #ffffff;
  --accent-ink: #0a4a44;

  --cover-scrim: linear-gradient(to top, rgba(0, 0, 0, 0.75) 0%, rgba(0, 0, 0, 0.1) 60%, transparent 100%);
  --cover-text: #ffffff;
  --cover-text-dim: rgba(255, 255, 255, 0.65);
  --cover-text-sub: rgba(255, 255, 255, 0.72);

  --shadow-1: 0 1px 0 rgba(0, 0, 0, 0.02), 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-2: 0 1px 0 rgba(0, 0, 0, 0.02), 0 6px 24px rgba(0, 0, 0, 0.06);
  --shadow-3: 0 24px 60px rgba(0, 0, 0, 0.1), 0 2px 6px rgba(0, 0, 0, 0.04);

  --radius: 0.625rem;
  --font-size-base: 16px;
  --font-scale: 1;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--surface-2);
  font-family: var(--font-body, ui-sans-serif), system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
}

.phone {
  max-width: 390px;
  margin: 24px auto;
  background: var(--bg);
  min-height: 760px;
  border-radius: 24px;
  overflow: hidden;
  box-shadow: var(--shadow-3);
  border: 1px solid var(--line);
}

/* Cover photo — CSS gradient standing in for an Unsplash photo of Lisbon */
.cover {
  position: relative;
  height: 200px;
  width: 100%;
  overflow: hidden;
  background:
    linear-gradient(180deg, #f4c97a 0%, #e8985a 35%, #c96b4f 65%, #8a4a52 100%);
}

.cover-photo-label {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono, ui-monospace);
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.35);
  text-align: center;
  padding: 0 32px;
}

.cover-scrim {
  position: absolute;
  inset: 0;
  background: var(--cover-scrim);
}

.cover-bottom {
  position: absolute;
  left: 14px;
  bottom: 14px;
  z-index: 2;
}

.cover-title {
  font-family: var(--font-heading, ui-sans-serif);
  font-weight: 700;
  font-size: calc(26px * var(--font-scale));
  letter-spacing: -0.02em;
  color: var(--cover-text);
  line-height: 1.05;
  text-shadow: 0 1px 4px rgba(0,0,0,0.5);
}

.cover-sub {
  font-family: var(--font-mono, ui-monospace);
  font-weight: 400;
  font-size: calc(10.5px * var(--font-scale));
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--cover-text-sub);
  margin-top: 4px;
}

.cover-meta-tag {
  position: absolute;
  left: 12px;
  top: 10px;
  z-index: 2;
  font-family: var(--font-mono, ui-monospace);
  font-size: calc(10.5px * var(--font-scale));
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--cover-text);
  text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(4px);
  padding: 3px 7px;
  border-radius: 6px;
}

/* Overflow menu trigger — upper right */
.overflow-wrap {
  position: absolute;
  top: 8px;
  right: 8px;
  z-index: 10;
}

.overflow-trigger {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  border-radius: 6px;
  background: rgba(0, 0, 0, 0.25);
  color: #ffffff;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  border: none;
}

/* Dropdown menu content — open */
.overflow-menu {
  position: absolute;
  top: calc(100% + 4px);
  right: 0;
  width: 188px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: calc(var(--radius) + 2px);
  box-shadow: var(--shadow-3);
  padding: 4px;
}

.overflow-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 8px;
  border-radius: 6px;
  font-size: calc(14px * var(--font-scale));
  color: var(--fg);
}

.overflow-item:hover,
.overflow-item.hover {
  background: var(--surface-2);
}

.overflow-item svg {
  color: var(--fg-3);
  flex-shrink: 0;
}

/* Page content below cover */
.screen {
  padding: 16px;
}

.page-title {
  font-family: var(--font-heading, ui-sans-serif);
  font-size: calc(20px * var(--font-scale));
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--fg);
}

.page-sub {
  font-size: calc(13px * var(--font-scale));
  color: var(--fg-3);
  margin-top: 2px;
}

svg.icon { display: block; }
</style>
</head>
<body>
<div class="phone">
  <div class="cover">
    <div class="cover-photo-label">Unsplash photo — Praça do Comércio, Lisbon, Portugal (golden hour)</div>
    <div class="cover-scrim"></div>

    <span class="cover-meta-tag">ACTIVE TRIP</span>

    <div class="cover-bottom">
      <div class="cover-title">Lisbon &amp; Porto</div>
      <div class="cover-sub">Portugal</div>
    </div>

    <!-- Overflow menu — MoreHorizontal trigger, OPEN -->
    <div class="overflow-wrap">
      <button class="overflow-trigger" title="Cover options" aria-expanded="true">
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
      </button>

      <div class="overflow-menu">
        <div class="overflow-item">
          <!-- Pencil -->
          <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/></svg>
          Edit Cover
        </div>
        <div class="overflow-item">
          <!-- Trash2 -->
          <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
          Remove Cover
        </div>
        <div class="overflow-item hover">
          <!-- Info -->
          <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
          Info
        </div>
      </div>
    </div>
  </div>

  <div class="screen">
    <div class="page-title">Lisbon &amp; Porto</div>
    <div class="page-sub">Jun 14 – Jun 22, 2026 · Portugal</div>
  </div>
</div>
</body>
</html>
