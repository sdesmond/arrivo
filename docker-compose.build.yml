# Build-from-source override. Layer it on top of docker-compose.yml from the cloned repo:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
# A local tag keeps source builds distinct from the published ghcr.io image.
services:
  app:
    image: arrivo-app:local
    build:
      context: .
      target: runner
