# Build-from-source override. Layer it on top of docker-compose.yml from the cloned repo:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
# Local tags keep source builds distinct from the published ghcr.io images.
services:
  migrate:
    image: packt-migrate:local
    build:
      context: .
      target: tools

  app:
    image: packt-app:local
    build:
      context: .
      target: runner
