# Team override for bmad-create-story.
# Scalars override the default; arrays append.

[workflow]

# After the story file and sprint-status.yaml are saved, run the plan
# reviewer inline before presenting the artifact to the user.
# Apply every BLOCKING fix directly to the artifact, then present the
# final clean (or warning-only) artifact. Do NOT spawn a subagent.

on_complete = "Run /plan-reviewer on the saved story file path (inline, not as a subagent). Read each reference file for the checks being run. Apply every BLOCKING fix directly to the artifact in place before presenting to the user. Present the reviewed, corrected artifact only after all blocking issues are resolved."
