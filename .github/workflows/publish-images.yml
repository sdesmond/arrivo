name: Publish images

# Releases publish on version tags (see docs/releasing.md). Manual runs build the current ref and push
# only a sha-<commit> tag, for testing an image on a host before cutting a release.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: app-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sdesmond/packt
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=sha,prefix=sha-

      - id: migrate-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sdesmond/packt-migrate
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=sha,prefix=sha-

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.app-meta.outputs.tags }}
          labels: ${{ steps.app-meta.outputs.labels }}
          cache-from: |
            type=gha,scope=runner
            type=gha,scope=tools
          cache-to: type=gha,mode=max,scope=runner

      - name: Build and push migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tools
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.migrate-meta.outputs.tags }}
          labels: ${{ steps.migrate-meta.outputs.labels }}
          cache-from: |
            type=gha,scope=tools
            type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=tools
