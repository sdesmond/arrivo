name: CI

# Static checks plus guards that keep src/db/schema.ts and the committed drizzle/ migrations in lockstep, and a
# smoke test of the self-hosting stack. Unit tests and the production build run locally (build-validator) and the
# unit tests again after merge (unit-tests.yml); the docker-smoke image build compiles the app. Playwright E2E
# stays local (build-validator, `test:e2e:affected`).
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://arrivo:arrivo@localhost:5432/arrivo
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npx tsc --noEmit

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: arrivo
          POSTGRES_PASSWORD: arrivo
          POSTGRES_DB: arrivo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arrivo -d arrivo"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # schema.ts changed without `npm run db:generate`: generate would write a new migration.
      - name: Migrations are up to date with schema.ts
        timeout-minutes: 5
        run: |
          # No stdin: an ambiguous rename would otherwise wait on drizzle-kit's interactive prompt.
          npx drizzle-kit generate </dev/null
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            echo "::error::src/db/schema.ts has changes with no migration. Run 'npm run db:generate' and commit drizzle/."
            git status --porcelain -- drizzle
            exit 1
          fi

      - name: Migrations apply to an empty database
        run: npm run db:migrate

      - name: Migrations are safe to re-run
        run: npm run db:migrate

      # A hand-edited migration can drift from schema.ts without touching the snapshot, so compare the
      # migrated schema to one that drizzle-kit builds straight from schema.ts.
      - name: Migrated schema matches schema.ts
        run: |
          pg() { docker run --rm --network host -e PGPASSWORD=arrivo postgres:17-alpine "$@"; }
          pg psql -h localhost -U arrivo -d arrivo -c "create database arrivo_push"
          DATABASE_URL=postgres://arrivo:arrivo@localhost:5432/arrivo_push npx drizzle-kit push --force </dev/null
          # pg_dump 17 adds a random restrict token per dump; the drizzle schema holds only the journal.
          dump() { pg pg_dump -s --no-owner --no-privileges -N drizzle -h localhost -U arrivo -d "$1" | grep -v '^.\(un\)\?restrict'; }
          dump arrivo > migrated.sql
          dump arrivo_push > pushed.sql
          diff -u migrated.sql pushed.sql || { echo "::error::Migrations do not produce the schema in src/db/schema.ts"; exit 1; }

  # Skipped jobs count as passed for required checks, so gate docker-smoke here rather than with workflow-level
  # path filters (which would leave a required check pending forever).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stack: ${{ steps.diff.outputs.stack }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(git diff --name-only "$BASE_SHA" HEAD)
          if echo "$files" | grep -Eq '^(Dockerfile|\.dockerignore|docker/|docker-compose[^/]*\.yml|drizzle/|drizzle\.config\.ts|package(-lock)?\.json|next\.config\.ts|\.nvmrc|\.github/workflows/ci\.yml|src/(db|middleware|proxy)|src/app/api|src/lib/storage)'; then
            echo "stack=true" >> "$GITHUB_OUTPUT"
          else
            echo "stack=false" >> "$GITHUB_OUTPUT"
          fi

  docker-smoke:
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    # Boots the self-hosting compose stack on this commit's image: a fresh install, then a restart.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.build.yml
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build app image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          load: true
          tags: arrivo-app:local
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner

      - name: Start the stack (first boot)
        run: docker compose up -d --wait --wait-timeout 180

      # No redirect following: if middleware sends /api/health to /sign-in, this must fail, not see a 200.
      - name: Health endpoint answers without signing in
        run: |
          code=$(curl -sS -o health.json -w '%{http_code}' --max-redirs 0 http://localhost:4850/api/health)
          [ "$code" = "200" ] && grep -q '"status":"ok"' health.json || { echo "::error::health returned $code"; cat health.json; exit 1; }

      # Standalone Next reports its own listen address in req.url; the redirect must use the browser's Host.
      - name: Sign-in redirect keeps the address the browser used
        run: |
          location=$(curl -sS -o /dev/null -w '%{redirect_url}' -H 'Host: 192.168.1.50:4850' http://localhost:4850/trips)
          [ "$location" = "http://192.168.1.50:4850/sign-in" ] || { echo "::error::redirected to $location"; exit 1; }

      - name: Migrations ran, uploads folder re-owned, secret generated
        run: |
          trips=$(docker compose exec -T db psql -U arrivo -d arrivo -tAc "select to_regclass('public.trips') is not null")
          [ "$trips" = "t" ] || { echo "::error::public.trips missing after first boot"; exit 1; }
          [ "$(sudo stat -c '%u:%g' data/storage)" = "1000:1000" ] || { echo "::error::data/storage not owned by PUID:PGID"; exit 1; }
          sudo test -s data/storage/.arrivo/auth-secret || { echo "::error::no generated auth secret"; exit 1; }
          sudo sha256sum data/storage/.arrivo/auth-secret > secret.sha

      - name: Restart keeps the secret and re-runs migrations cleanly
        run: |
          docker compose restart app
          docker compose up -d --wait --wait-timeout 180
          sudo sha256sum -c secret.sha
          curl -fsS --max-redirs 0 http://localhost:4850/api/health | grep -q '"status":"ok"'

      - name: Stack logs
        if: failure()
        run: docker compose logs
