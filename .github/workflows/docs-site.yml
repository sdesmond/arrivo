name: Docs site

# Publishes site/ to GitHub Pages on version tags (see docs/releasing.md) or manual runs. Pull requests that touch
# the site, or the files it is generated from, only build it (tests, type check, link check), no deploy.
on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    paths:
      - "site/**"
      - "docs/self-hosting.md"
      - "CHANGELOG.md"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # Astro can require a newer Node patch than the runner image has cached.
          check-latest: true
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
      - run: npm run check:links

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
