name: pr-review

# Structural PR review, entirely scripted (scripts/pr-review): secrets, tests, changelog, title/description and
# scope. No model, no tokens, no repository secrets.
#
# pull_request_target runs this workflow and script as they exist on the base branch and gives fork PRs a token that
# can comment. That is safe only while this job never checks out, builds or runs the PR's code: it reads the title,
# body and diff through the API and passes them around as data. Keep it that way. A change to the reviewer takes
# effect once it is merged, so it cannot be tried out on its own PR.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # commenting on a PR needs this; issues: write alone returns 403
    steps:
      - name: Check out the base branch (never the PR head)
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Review
        run: node scripts/pr-review/review.mjs --pr "$PR_NUMBER" --repo "$REPO"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
