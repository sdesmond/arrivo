name: pr-review

# Structural PR review. Secrets and test pairing are checked by script; one small `claude -p` call (metadata only, no
# diff) judges title/description and scope. Authenticates with the CLAUDE_CODE_OAUTH_TOKEN repository secret
# (a Claude subscription token from `claude setup-token`). See scripts/pr-review/review.mjs.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs get a read-only token and no secrets, so they can neither comment nor call the model.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: write # the sticky review comment is an issue comment
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.303

      - name: Review
        run: node scripts/pr-review/review.mjs --pr "$PR_NUMBER" --repo "$REPO"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
